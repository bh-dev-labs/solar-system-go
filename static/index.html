<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar system in Go</title>
<style>
  :root { --panel: rgba(10, 14, 24, 0.86); --ink: #e8ecf4; --muted: #9aa6bd; --line: rgba(255,255,255,0.12); --accent: #7fb3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060c; color: var(--ink); font: 14px/1.5 system-ui, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: crosshair; }
  .hud { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  #controls { left: 16px; top: 16px; padding: 12px 14px; width: min(340px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; }
  #controls h1 { font-size: 16px; font-weight: 500; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; flex-wrap: wrap; }
  .row label { color: var(--muted); min-width: 64px; font-size: 12px; }
  input[type=range] { flex: 1; min-width: 100px; }
  input[type=date], select, button { background: #141a28; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  .val { min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; }
  #date { font-size: 18px; font-weight: 500; letter-spacing: 0.02em; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips button { padding: 2px 7px; font-size: 11px; }
  #info { right: 16px; top: 16px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; padding: 14px 16px; display: none; }
  #info.show { display: block; }
  #info h2 { margin: 0; font-size: 20px; font-weight: 500; }
  #info .kind { color: var(--muted); font-size: 12px; text-transform: capitalize; }
  #info .head { font-size: 13px; margin: 6px 0 10px; color: #cdd6e6; }
  #globe { width: min(100%, 220px); aspect-ratio: 1; border-radius: 50%; margin: 6px auto 10px; display: block; background-size: 200% 100%; background-repeat: repeat-x; box-shadow: inset -40px -20px 60px rgba(0,0,0,0.85), inset 10px 8px 30px rgba(255,255,255,0.08); animation: spin 24s linear infinite; }
  #globe.retro { animation-direction: reverse; }
  @keyframes spin { from { background-position-x: 0; } to { background-position-x: -200%; } }
  .live { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 12px; margin-bottom: 10px; }
  .live b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .live span { color: var(--muted); }
  #facts { margin: 0; padding-left: 18px; font-size: 13px; }
  #facts li { margin: 4px 0; }
  #src { color: var(--muted); font-size: 11px; margin-top: 10px; }
  #close { position: absolute; right: 10px; top: 10px; }
  #legend { left: 16px; bottom: 16px; padding: 8px 12px; font-size: 11px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  #legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: middle; }
  #hint { left: 16px; bottom: 56px; padding: 6px 10px; font-size: 11px; color: var(--muted); }
  @media (max-width: 760px) { #info { top: auto; bottom: 16px; max-height: 55vh; } #legend { display: none; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>

<div id="controls" class="hud">
  <h1>Solar system, computed in Go</h1>
  <div id="date">loading</div>
  <div class="row"><label>Time warp</label><input type="range" id="speed" min="0" max="7" step="1" value="3"><span class="val" id="speedv"></span></div>
  <div class="row"><label>Jump to</label><input type="date" id="pick" min="1800-01-01" max="2050-12-31"><button id="today">Today</button><button id="j2000">J2000</button></div>
  <div class="row"><label>View</label><button id="scale" class="on">Schematic</button><button id="tiltbtn">Tilt 60°</button><button id="pause"><span>Pause</span></button></div>
  <div class="row"><label>Tilt</label><input type="range" id="tilt" min="0" max="90" step="1" value="60"></div>
  <div class="row"><label>Zoom</label><input type="range" id="zoom" min="-2" max="3" step="0.01" value="0"><span class="val" id="zoomv">1×</span></div>
  <div class="row"><label>Show</label><div class="chips">
    <button data-layer="orbits" class="on">Orbits</button>
    <button data-layer="labels" class="on">Labels</button>
    <button data-layer="main" class="on">Asteroid belt</button>
    <button data-layer="trojans" class="on">Trojans</button>
    <button data-layer="kuiper" class="on">Kuiper belt</button>
    <button data-layer="comets" class="on">Comets</button>
    <button data-layer="dwarfs" class="on">Dwarf planets</button>
  </div></div>
  <div class="row"><label>Focus</label><select id="focus"><option value="">Sun</option></select></div>
</div>

<div id="info" class="hud">
  <button id="close" aria-label="Close">×</button>
  <div class="kind" id="kind"></div>
  <h2 id="name"></h2>
  <div class="head" id="headline"></div>
  <div id="globe"></div>
  <div class="live" id="live"></div>
  <ul id="facts"></ul>
  <div id="src"></div>
</div>

<div id="legend" class="hud">
  <span><i style="background:#ffd27a"></i>Sun</span>
  <span><i style="background:#4f8fdc"></i>Planet</span>
  <span><i style="background:#d8c2a8"></i>Dwarf planet</span>
  <span><i style="background:#8a877f"></i>Main belt</span>
  <span><i style="background:#b08a5a"></i>Trojans</span>
  <span><i style="background:#6f8fb3"></i>Kuiper belt</span>
  <span><i style="background:#cfe6ff"></i>Comet</span>
</div>
<div id="hint" class="hud">Click a body for facts. Scroll to zoom, drag to pan.</div>

<script src="app.js"></script>
</body>
</html>
